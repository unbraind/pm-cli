name: CI

on:
  push:
    branches:
      - main
    # paths uses last-match-wins so plugin markdown (slash commands, skills,
    # subagents — functional assets smoke-tested in CI) re-includes after the
    # blanket markdown exclusion. paths-ignore cannot express re-includes.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.github/ISSUE_TEMPLATE/**"
      - "plugins/**"
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-analyzer-readiness:
    name: Release analyzer readiness (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reviewed analyzer provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/hosted-analysis-gate.mjs --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --json

  build-foundation:
    name: Build foundation (Ubuntu, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore exact TypeScript and Vitest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts', 'scripts/*.mjs', 'scripts/**/*.mjs', 'scripts/*.mts', 'scripts/**/*.mts') }}

      - name: Restore LanceDB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .agents/pm/search/lancedb
          key: pm-cli-observability-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', '.agents/pm/settings.json', '.agents/pm/**/*.toon', '.agents/pm/**/*.md', 'src/**/*.ts', 'scripts/**/*.mjs', 'tests/**/*.ts') }}
          restore-keys: |
            pm-cli-observability-cache-${{ runner.os }}-node24-
            pm-cli-observability-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-node24-ubuntu
          path: dist
          if-no-files-found: error

  build-test:
    name: Runtime smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build-foundation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
          - os: ubuntu-latest
            node: 24

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-node24-ubuntu
          path: dist

      - name: Dist artifact version smoke
        run: node dist/cli.js --version

  gates:
    name: Gates (${{ matrix.gate }})
    needs: build-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate:
          - typecheck
          - static
          - compat
          - smokes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore exact TypeScript and Vitest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts', 'scripts/*.mjs', 'scripts/**/*.mjs', 'scripts/*.mts', 'scripts/**/*.mts') }}

      - name: Restore LanceDB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .agents/pm/search/lancedb
          key: pm-cli-observability-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', '.agents/pm/settings.json', '.agents/pm/**/*.toon', '.agents/pm/**/*.md', 'src/**/*.ts', 'scripts/**/*.mjs', 'tests/**/*.ts') }}
          restore-keys: |
            pm-cli-observability-cache-${{ runner.os }}-node24-
            pm-cli-observability-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-node24-ubuntu
          path: dist

      # Bootstrap clone-local merge-driver configuration before any static
      # command invokes the repository's own tracker health/validation gate.
      - name: Prepare tracker clone invariants
        if: matrix.gate == 'static'
        run: |
          node dist/cli.js merge install --no-extensions
          git diff --exit-code -- .gitattributes

      - name: Run typecheck gate
        if: matrix.gate == 'typecheck'
        run: pnpm typecheck

      - name: Run static + secret + version gates
        if: matrix.gate == 'static'
        run: |
          pnpm version:check
          pnpm changelog:pm:check
          pnpm contracts:check
          pnpm sdk:surface:check
          pnpm security:scan
          pnpm lint
          node scripts/release/package-artifact-gate.mjs

      - name: Enforce discovery and answer token budgets
        if: matrix.gate == 'static'
        run: pnpm quality:token-budget

      # Merge-safety gates for the tracked .agents/pm workspace
      # (pm-iwsj/pm-pdr8t1): validation walks every history stream for drift;
      # the per-item command remains an explicitly named command smoke.
      - name: Run tracker merge-safety gates
        if: matrix.gate == 'static'
        run: |
          node dist/cli.js validate --check-storage-integrity --check-history-drift --strict-exit --json --no-extensions
          representative_id="$(node dist/cli.js list --status all --limit 1 --sort created_at --order desc --json --no-extensions | jq -er '.items[0].id')"
          node dist/cli.js history "${representative_id}" --verify --strict-exit --json --no-extensions > /dev/null

      # Every ci-triggered assurance gate runs here (pm-fhifkc). Before this,
      # only tracker-context-quality was wired to pull requests; graph-composition
      # and record-integrity reached CI solely through `pnpm quality:static`,
      # which runs in nightly.yml and release.yml, so the append-only history
      # assertion that carries the immutability guarantee was never evaluated
      # on a changeset before it merged.
      - name: Run tracker assurance gates
        if: matrix.gate == 'static'
        run: |
          node dist/cli.js assurance run tracker-context-quality --trigger ci --dry-run --json
          node dist/cli.js assurance run graph-composition --trigger ci --dry-run --json
          node dist/cli.js assurance run record-integrity --trigger ci --dry-run --json

      - name: Run compatibility migration gate
        if: matrix.gate == 'compat'
        timeout-minutes: 6
        run: node scripts/release/compatibility-check.mjs --json

      - name: Run npx + plugin smoke gates
        if: matrix.gate == 'smokes'
        run: |
          pnpm smoke:npx
          pnpm dogfood:package-first
          node scripts/smoke-claude-plugin.mjs

      - name: Verify test isolation inside a Claude Code host
        if: matrix.gate == 'smokes'
        env:
          CLAUDECODE: "1"
          PM_RUN_TESTS_SKIP_BUILD: "1"
        run: node scripts/run-tests.mjs test -- tests/unit/core/shared/shared-helpers.spec.ts tests/unit/commands/claim-command.spec.ts tests/unit/sdk/agent-runtime-primitives.spec.ts

      - name: Verify test isolation inside a Codex host
        if: matrix.gate == 'smokes'
        env:
          CODEX_THREAD_ID: "hosted-ci-contract"
          PM_RUN_TESTS_SKIP_BUILD: "1"
        run: node scripts/run-tests.mjs test -- tests/unit/core/shared/shared-helpers.spec.ts tests/unit/commands/claim-command.spec.ts tests/unit/sdk/agent-runtime-primitives.spec.ts

      - name: Run advisory search eval harness
        if: matrix.gate == 'smokes'
        continue-on-error: true
        run: |
          node dist/cli.js install search-advanced --project --json
          node dist/cli.js reindex --mode keyword --eval --eval-fixtures tests/search-eval/golden-queries.json --json

      - name: Run required context relevance evaluation gate
        if: matrix.gate == 'smokes'
        run: pnpm quality:context-eval

  coverage-shards:
    name: Coverage shard ${{ matrix.shard }}/4
    needs: build-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-node24-ubuntu
          path: dist

      - name: Run coverage shard
        env:
          PM_RUN_TESTS_SKIP_BUILD: "1"
          PM_TEST_SHARD: ${{ matrix.shard }}/4
        run: >-
          node scripts/run-tests.mjs coverage-shard --
          --shard=${{ matrix.shard }}/4
          --reporter=default
          --reporter=github-actions
          --reporter=./scripts/test-reliability-reporter.mts
          --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
          --coverage.thresholds.lines=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0

      - name: Upload coverage shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          if-no-files-found: error

      # Keep diagnostic JSON out of Vitest's merge-reports directory: the
      # merger treats every JSON file there as a serialized blob array.
      - name: Upload test reliability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reliability-${{ matrix.shard }}
          path: .vitest-reports/reliability-${{ matrix.shard }}-4.json
          if-no-files-found: error

  coverage:
    name: Gates (coverage)
    needs: coverage-shards
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge coverage and enforce global thresholds
        run: |
          pnpm exec vitest --merge-reports=.vitest-reports --coverage
          node scripts/release/coverage-threshold-gate.mjs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-node24-ubuntu-latest
          path: coverage
          if-no-files-found: ignore

      # Codecov ingests the v8 line-level lcov report. `!cancelled()` so coverage
      # still uploads when the gate fails on the 100% threshold (that is exactly
      # when the Codecov report is most useful for diagnosis).
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          disable_search: true
          flags: unittests
          name: pm-cli-coverage
          override_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          override_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          verbose: true

      # Codecov Test Analytics ingests the JUnit report for flaky-test and
      # failure analytics. Runs on failure too so failing tests are recorded.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./coverage/junit.xml
          disable_search: true
          flags: unittests
          name: pm-cli-test-results
          override_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          override_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          verbose: true

  windows-regression:
    name: Windows regression (Node 24)
    # Gate this focused Windows slice on a green foundation build; the job is
    # otherwise self-contained because it must install and run on windows-latest.
    needs: build-foundation
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore exact TypeScript and Vitest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts', 'scripts/*.mjs', 'scripts/**/*.mjs', 'scripts/*.mts', 'scripts/**/*.mts') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Guards every Windows-only test class the nightly exposed:
      # (1) file://-URL TypeScript source imports (sourceModule helper),
      # (2) .mjs script imports whose shebang must be stripped by the test
      #     transform (scriptModule helper + the strip-script-shebang Vite
      #     plugin),
      # (3) the path-separator / mocked-path class across tests/unit/scripts/**
      #     (POSIX-keyed fs mocks vs native separators, win32 `.cmd` command
      #     resolution, and native-separator path assertions) closed in pm-s5pe,
      # (4) the telemetry runtime's detached flush scheduler, whose unit suite
      #     must mock the spawn rather than launch a real, network-touching
      #     node child that lingers and crashes the vitest worker on teardown
      #     (GH-348), and
      # (5) background test-run signal handling, whose unit helpers must not
      #     send OS-level signals to the Vitest worker process on Windows
      #     (GH-376), and
      # (6) stale lock cleanup races, whose owner-path and orphan-gate probes
      #     must stay portable on Windows Node 24 (GH-427), and
      # (7) native-path command rendering plus package-source suffix checks,
      #     which must preserve Windows separators (GH-522 / pm-u5zr).
      # The two non-scripts guards (cli-main-errors, runtime-schema-path-win32)
      # plus the harness contract test stay pinned; the full tests/unit/scripts/
      # directory now runs so a fresh Windows-only script regression fails this
      # required per-PR check rather than only the nightly.
      - name: Run Windows source-import and script regression tests
        env:
          PM_RUN_TESTS_SKIP_BUILD: "1"
        run: node scripts/run-tests.mjs test -- tests/unit/cli/cli-main-errors.spec.ts tests/unit/cli/argv-utils.spec.ts tests/unit/core/schema/runtime-schema-path-win32-guard.spec.ts tests/unit/helpers/scriptModule.spec.ts tests/unit/scripts/ tests/unit/packages/package-manifest.spec.ts tests/unit/core/telemetry/telemetry-runtime.spec.ts tests/unit/commands/init-command.spec.ts tests/integration/init-path-guard.integration.spec.ts tests/unit/commands/test-runs-command.spec.ts tests/unit/core/item/core-item-lock-coverage.spec.ts tests/unit/extensions/extension-source-resolution.spec.ts tests/unit/sdk/contracts-full-projection.spec.ts tests/unit/sdk/extension-migrations.spec.ts tests/unit/sdk/merge-extension-asset-scope.spec.ts tests/integration/release-automation-contract.spec.ts tests/unit/core/extensions/activation-summary.spec.ts

      # The packed-npm-extension install path exercises the Windows `.cmd` npm
      # spawn + tar extraction + hosted-SDK junction class that only the Node 24
      # nightly previously caught (GH-348). Run just that integration case here so
      # a Windows-only install regression fails this required per-PR check.
      - name: Run Windows packed-npm-extension install regression test
        env:
          PM_RUN_TESTS_SKIP_BUILD: "1"
        run: node scripts/run-tests.mjs test -- tests/integration/cli.integration.spec.ts -t "installs runtime dependencies for packed npm package extensions"

name: Auto Release

on:
  schedule:
    - cron: "35 2 * * *"
  issues:
    types:
      - closed
  workflow_dispatch:
    inputs:
      push:
        description: "Push commit and tag to trigger publish workflow"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Run full pipeline without mutating git history"
        type: boolean
        required: false
        default: false
      telemetry_mode:
        description: "Telemetry gate mode"
        type: choice
        required: false
        default: "off"
        options:
          - "off"
          - "best-effort"
          - "required"

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  auto-release:
    name: Auto release pipeline
    if: "${{ github.event_name != 'issues' || (github.actor != 'github-actions[bot]' && github.event.issue.title == 'Auto Release blocked: scheduled run failed' && github.event.issue.user.login == 'github-actions[bot]') }}"
    runs-on: ubuntu-latest
    # This job runs the local release gates before waiting for the serial
    # exact-tag Release workflow, so its budget must include both pipelines.
    timeout-minutes: 90
    permissions:
      # Blocker-closure recovery dispatches the reviewed current workflow for
      # the immutable tag; it never reruns historical code or creates a
      # replacement same-day version.
      actions: write
      contents: write
      # The alert steps open, update, close, and comment on the scheduled
      # release blocker while the release pipeline itself records retry state.
      issues: write
    environment:
      name: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not persist the elevated release token through checkout or
          # dependency installation. run-release-pipeline scopes RELEASE_PAT to
          # the git push process only.
          persist-credentials: false

      - name: Detect immutable same-day automatic target
        id: retry_target
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          # JavaScript template expressions are intentionally protected from shell expansion.
          # shellcheck disable=SC2016
          today_version="$(node --input-type=module -e 'const d = new Date(); console.log(`${d.getUTCFullYear()}.${d.getUTCMonth() + 1}.${d.getUTCDate()}`);')"
          existing_tag="$(git tag --list "v${today_version}" | head -n 1)"
          if [[ -z "${existing_tag}" ]]; then
            exit 0
          fi
          existing_sha="$(git rev-list -n 1 "${existing_tag}")"
          echo "existing_tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
          echo "existing_sha=${existing_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify release analyzer provenance before build
        if: steps.retry_target.outputs.existing_tag == ''
        env:
          RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: GH_TOKEN="${RELEASE_POLICY_TOKEN:-${GH_TOKEN}}" node scripts/release/hosted-analysis-gate.mjs --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --json

      - name: Setup pnpm
        if: steps.retry_target.outputs.existing_tag == ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        if: steps.retry_target.outputs.existing_tag == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        if: steps.retry_target.outputs.existing_tag == ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Restore TypeScript and Vitest caches
        if: steps.retry_target.outputs.existing_tag == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts') }}
          restore-keys: |
            pm-cli-validation-cache-${{ runner.os }}-node24-
            pm-cli-validation-cache-${{ runner.os }}-

      - name: Restore LanceDB cache
        if: steps.retry_target.outputs.existing_tag == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .agents/pm/search/lancedb
          key: pm-cli-observability-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', '.agents/pm/settings.json', '.agents/pm/**/*.toon', '.agents/pm/**/*.md', 'src/**/*.ts', 'scripts/**/*.mjs', 'tests/**/*.ts') }}
          restore-keys: |
            pm-cli-observability-cache-${{ runner.os }}-node24-
            pm-cli-observability-cache-${{ runner.os }}-

      - name: Install dependencies
        if: steps.retry_target.outputs.existing_tag == ''
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.retry_target.outputs.existing_tag == ''
        run: pnpm build

      - name: Run auto release pipeline
        id: auto_release
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # GitHub Actions evaluates boolean `false` as falsy in `&& ... || ...`
          # ternaries, so the naive `inputs.push || 'true'` silently overrides
          # an explicit `push=false`. Nest a second ternary that coerces the
          # boolean input into the literal string 'true'/'false' first, then
          # fall through to the schedule default with the outer ternary.
          INPUT_PUSH: ${{ github.event_name == 'workflow_dispatch' && (inputs.push && 'true' || 'false') || 'true' }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'false' }}
          INPUT_TELEMETRY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.telemetry_mode || 'off' }}
          RELEASE_PAT_CONFIGURED: ${{ secrets.RELEASE_PAT != '' }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          # The pipeline consumes and removes this dedicated input before
          # launching any gate. Only hosted-analysis receives it as GH_TOKEN.
          RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PERSONAL_ADMIN_TOKEN: ${{ secrets.SENTRY_PERSONAL_ADMIN_TOKEN }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EXISTING_RELEASE_TAG: ${{ steps.retry_target.outputs.existing_tag }}
          EXISTING_RELEASE_SHA: ${{ steps.retry_target.outputs.existing_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Gate runners write their verdict here when they fail, so the alert
          # step can name the real cause instead of the preflight state.
          RELEASE_FAILURE_RECORD: ${{ runner.temp }}/release-failure-record.json
        run: |
          set -euo pipefail
          render_recorded_failure() {
            node scripts/release/release-failure-record.mjs "${RELEASE_FAILURE_RECORD}" >> "${GITHUB_OUTPUT}"
          }
          record_failure_stage() {
            node scripts/release/release-failure-record.mjs record-stage "${RELEASE_FAILURE_RECORD}" "$1" "${2:-1}"
            render_recorded_failure
          }
          watch_release_workflow() {
            local run_id="$1"
            local watch_status
            set +e
            gh run watch "${run_id}" --compact --exit-status --interval 30
            watch_status=$?
            set -e
            if [[ "${watch_status}" -eq 0 ]]; then
              return 0
            fi
            if ! gh run view "${run_id}" --json databaseId,status,conclusion,headSha,headBranch,event,jobs \
              | node scripts/release/release-failure-record.mjs record-workflow "${RELEASE_FAILURE_RECORD}" release-workflow "${watch_status}"; then
              printf '{}\n' \
                | node scripts/release/release-failure-record.mjs record-workflow "${RELEASE_FAILURE_RECORD}" release-workflow "${watch_status}"
            fi
            render_recorded_failure
            return "${watch_status}"
          }
          current_day="$(date -u +%F)"
          if [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            issue_created_day="${ISSUE_CREATED_AT%%T*}"
            if [[ -z "${issue_created_day}" || "${issue_created_day}" != "${current_day}" ]]; then
              echo "Auto Release retry skipped because blocker issue was not created on the current UTC day."
              echo "retry_skip_reason=same_day_window_expired" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [[ -z "${ISSUE_NUMBER}" ]]; then
              echo "Auto Release retry refused because the blocker issue number was unavailable."
              echo "retry_skip_reason=retry_issue_number_unavailable" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            retry_marker="<!-- auto-release-retry-attempted:${current_day} -->"
            # `gh issue view` normalizes the GitHub Actions app login to
            # `github-actions`, while REST surfaces may retain the canonical
            # `github-actions[bot]` login. Trust only those two representations.
            if ! trusted_issue_comments="$(gh issue view "${ISSUE_NUMBER}" --json comments --jq '.comments[] | select(.author.login? == "github-actions" or .author.login? == "github-actions[bot]") | .body')"; then
              echo "Could not inspect Auto Release blocker issue #${ISSUE_NUMBER}; refusing untracked production retry."
              echo "retry_skip_reason=retry_state_unavailable" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if grep -Fq "${retry_marker}" <<< "${trusted_issue_comments}"; then
              echo "Auto Release retry refused because this blocker issue already recorded a current-day retry attempt."
              echo "retry_skip_reason=retry_already_attempted" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            retry_body="Auto Release retry attempt recorded for ${current_day} UTC.

            This marker prevents repeated production retries for the same blocker issue if the retry fails and the issue is closed again before UTC midnight.

            ${retry_marker}"
            if ! gh issue comment "${ISSUE_NUMBER}" --body "${retry_body}"; then
              echo "Could not record Auto Release retry marker on blocker issue #${ISSUE_NUMBER}; refusing untracked production retry."
              exit 1
            fi
          fi
          if [[ -n "${EXISTING_RELEASE_TAG}" ]]; then
            echo "Same-day tag ${EXISTING_RELEASE_TAG} already exists; selecting authoritative exact-tag Release evidence before any preparation work."
            release_runs="$(gh run list --workflow Release --limit 100 --json databaseId,status,conclusion,headBranch,headSha,event,createdAt,displayTitle)"
            selection="$(printf '%s' "${release_runs}" | node scripts/release/release-run-selection.mjs \
              --tag "${EXISTING_RELEASE_TAG}" \
              --tag-sha "${EXISTING_RELEASE_SHA}" \
              --default-branch "${DEFAULT_BRANCH}")"
            dispatch_evidence=""
            if [[ "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).reason);' "${selection}")" != "successful_run" ]]; then
              while IFS= read -r run_id; do
                if [[ -z "${run_id}" ]]; then
                  continue
                fi
                run_log="${RUNNER_TEMP}/release-run-${run_id}.log"
                if gh run view "${run_id}" --log > "${run_log}" 2>/dev/null && grep -Fq "RELEASE_TAG: ${EXISTING_RELEASE_TAG}" "${run_log}"; then
                  dispatch_evidence="${run_id}"
                  rm -f "${run_log}"
                  break
                fi
                rm -f "${run_log}"
              done < <(printf '%s' "${release_runs}" | node -e 'const fs=require("fs"); const currentDay=process.argv[1]; const defaultBranch=process.argv[2]; const runs=JSON.parse(fs.readFileSync(0,"utf8")).filter((run)=>run.event === "workflow_dispatch" && run.status === "completed" && run.conclusion === "success" && run.headBranch === defaultBranch && run.createdAt.startsWith(currentDay)).slice(0, 5); for (const run of runs) console.log(run.databaseId);' "${current_day}" "${DEFAULT_BRANCH}")
              selection="$(printf '%s' "${release_runs}" | node scripts/release/release-run-selection.mjs \
                --tag "${EXISTING_RELEASE_TAG}" \
                --tag-sha "${EXISTING_RELEASE_SHA}" \
                --default-branch "${DEFAULT_BRANCH}" \
                --dispatch-run-ids "${dispatch_evidence}")"
            fi
            RELEASE_RUN_ID="$(node -e 'const selected=JSON.parse(process.argv[1]).selected; process.stdout.write(selected ? String(selected.database_id) : "");' "${selection}")"
            RELEASE_RUN_STATUS="$(node -e 'const selected=JSON.parse(process.argv[1]).selected; process.stdout.write(selected?.status ?? "");' "${selection}")"
            RELEASE_RUN_CONCLUSION="$(node -e 'const selected=JSON.parse(process.argv[1]).selected; process.stdout.write(selected?.conclusion ?? "");' "${selection}")"

            if [[ "${RELEASE_RUN_STATUS}" == "completed" && "${RELEASE_RUN_CONCLUSION}" == "success" ]]; then
              echo "Existing Release workflow ${RELEASE_RUN_ID} for ${EXISTING_RELEASE_TAG} already proved successful immutable publication."
            elif [[ -n "${RELEASE_RUN_ID}" && "${RELEASE_RUN_STATUS}" != "completed" ]]; then
              echo "Waiting for active exact-tag Release workflow ${RELEASE_RUN_ID}."
              watch_release_workflow "${RELEASE_RUN_ID}" || exit "$?"
            else
              dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              gh workflow run release.yml --ref "${DEFAULT_BRANCH}" -f tag="${EXISTING_RELEASE_TAG}"
              echo "Dispatched the reviewed current Release workflow from ${DEFAULT_BRANCH} for immutable source ${EXISTING_RELEASE_TAG}."
              RELEASE_RUN_ID=""
              for _attempt in $(seq 1 30); do
                dispatched_runs="$(gh run list --workflow Release --event workflow_dispatch --branch "${DEFAULT_BRANCH}" --limit 20 --json databaseId,status,conclusion,headBranch,headSha,event,createdAt,displayTitle)"
                dispatch_selection="$(printf '%s' "${dispatched_runs}" | node scripts/release/release-run-selection.mjs \
                  --tag "${EXISTING_RELEASE_TAG}" \
                  --tag-sha "${EXISTING_RELEASE_SHA}" \
                  --default-branch "${DEFAULT_BRANCH}" \
                  --created-after "${dispatch_started_at}")"
                RELEASE_RUN_ID="$(node -e 'const selected=JSON.parse(process.argv[1]).selected; process.stdout.write(selected ? String(selected.database_id) : "");' "${dispatch_selection}")"
                if [[ -n "${RELEASE_RUN_ID}" ]]; then
                  break
                fi
                sleep 10
              done
              if [[ -z "${RELEASE_RUN_ID}" ]]; then
                echo "Current-workflow recovery run for ${EXISTING_RELEASE_TAG} did not become visible in time."
                record_failure_stage release-workflow-discovery 1
                exit 1
              fi
              watch_release_workflow "${RELEASE_RUN_ID}" || exit "$?"
            fi

            if ! verified_release_tag="$(gh release view "${EXISTING_RELEASE_TAG}" --json tagName,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"; then
              echo "Existing release ${EXISTING_RELEASE_TAG} could not be verified through public GitHub Release metadata."
              record_failure_stage github-release-verification 1
              exit 1
            fi
            if [[ "${verified_release_tag}" != "${EXISTING_RELEASE_TAG}" ]]; then
              echo "Existing release ${EXISTING_RELEASE_TAG} lacks public non-draft GitHub Release metadata."
              record_failure_stage github-release-verification 1
              exit 1
            fi
            release_version="${EXISTING_RELEASE_TAG#v}"
            npm_package="$(node -p 'require("./package.json").name')"
            public_npmrc="${RUNNER_TEMP}/same-day-public-npmrc"
            : > "${public_npmrc}"
            if ! verified_npm_version="$(env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm_config_userconfig="${public_npmrc}" npm_config_cache="${RUNNER_TEMP}/same-day-npm-cache" npm view "${npm_package}@${release_version}" version --json | node -e 'let input=""; process.stdin.on("data", (chunk) => { input += chunk; }); process.stdin.on("end", () => { const parsed=JSON.parse(input); process.stdout.write(typeof parsed === "string" ? parsed : ""); });')"; then
              echo "Existing release ${EXISTING_RELEASE_TAG} could not be verified through the public npm registry."
              record_failure_stage npm-publication-verification 1
              exit 1
            fi
            if [[ "${verified_npm_version}" != "${release_version}" ]]; then
              echo "Existing release ${EXISTING_RELEASE_TAG} is not publicly available from npm at the exact version."
              record_failure_stage npm-publication-verification 1
              exit 1
            fi
            echo "Verified same-day GitHub Release and npm publication for ${EXISTING_RELEASE_TAG} at ${EXISTING_RELEASE_SHA}."
            echo "published_tag=${EXISTING_RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
            echo "published_sha=${EXISTING_RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${INPUT_DRY_RUN}" == "true" && "${INPUT_PUSH}" == "true" ]]; then
            echo "dry_run=true cannot be combined with push=true"
            exit 2
          fi
          if [[ "${INPUT_PUSH}" == "true" && "${INPUT_DRY_RUN}" != "true" && ( "${RELEASE_PAT_CONFIGURED}" != "true" || -z "${RELEASE_PUSH_TOKEN//[[:space:]]/}" ) ]]; then
            echo "RELEASE_PAT is required before Auto Release can push the checked version commit/tag to protected main."
            echo "Create a release environment secret from a maintainer token with contents:write and branch-protection bypass rights."
            exit 1
          fi
          if [[ "${INPUT_PUSH}" == "true" && "${INPUT_DRY_RUN}" != "true" && -z "${SENTRY_PERSONAL_ADMIN_TOKEN:-}" ]]; then
            echo "SENTRY_PERSONAL_ADMIN_TOKEN is required before Auto Release can create a version commit/tag."
            echo "The downstream Release workflow treats the Sentry reliability gate as mandatory; failing here prevents unpublished tags."
            exit 1
          fi

          args=(--json --author "github-actions[bot]" --telemetry-mode "${INPUT_TELEMETRY_MODE}")
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${INPUT_PUSH}" == "true" ]]; then
            args+=(--push)
          fi
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          set +e
          node scripts/release/run-release-pipeline.mjs "${args[@]}"
          PIPELINE_STATUS=$?
          set -e
          if [[ "${PIPELINE_STATUS}" -ne 0 ]]; then
            # Publish the failing gate's own verdict as step outputs so the
            # blocker issue names a cause the run actually produced.
            node scripts/release/release-failure-record.mjs "${RELEASE_FAILURE_RECORD}" >> "${GITHUB_OUTPUT}"
            exit "${PIPELINE_STATUS}"
          fi
          NEW_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ "${INPUT_PUSH}" != "true" || "${INPUT_DRY_RUN}" == "true" || -z "${NEW_TAG}" || "${NEW_TAG}" == "${PREVIOUS_TAG}" ]]; then
            echo "No new pushed release tag detected; publish dispatch skipped."
            echo "retry_skip_reason=no_new_pushed_release_tag" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Waiting for tag-push Release workflow for ${NEW_TAG}."
          RELEASE_RUN_ID=""
          for _attempt in $(seq 1 30); do
            RELEASE_RUN_ID="$(gh run list --workflow Release --event push --branch "${NEW_TAG}" --limit 20 --json databaseId,status,headBranch,headSha,createdAt \
              | node -e 'const fs=require("fs"); const tag=process.argv[1]; const runs=JSON.parse(fs.readFileSync(0,"utf8")); const run=runs.find((entry)=>entry.headBranch===tag && ["queued","in_progress","waiting"].includes(entry.status)); if (run) console.log(run.databaseId);' "${NEW_TAG}")"
            if [[ -n "${RELEASE_RUN_ID}" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${RELEASE_RUN_ID}" ]]; then
            echo "Tag-push Release workflow for ${NEW_TAG} did not become visible in time."
            record_failure_stage release-workflow-discovery 1
            exit 1
          fi
          watch_release_workflow "${RELEASE_RUN_ID}" || exit "$?"
          PUBLISHED_SHA="$(git rev-list -n 1 "${NEW_TAG}")"
          echo "published_tag=${NEW_TAG}" >> "${GITHUB_OUTPUT}"
          echo "published_sha=${PUBLISHED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Resolve blocked scheduled auto-release issue
        if: success() && github.event_name == 'schedule' && steps.auto_release.outputs.published_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ steps.auto_release.outputs.published_sha }}
          RELEASE_TAG: ${{ steps.auto_release.outputs.published_tag }}
        run: |
          set -euo pipefail
          title="Auto Release blocked: scheduled run failed"
          existing_issue=""
          if ! existing_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"; then
            echo "Could not query blocked auto-release issues after successful publish; leaving release status successful."
            exit 0
          fi
          if [[ -z "${existing_issue}" ]]; then
            echo "No open blocked auto-release issue found."
            exit 0
          fi
          body="Scheduled Auto Release succeeded and published \`${RELEASE_TAG}\`.

          Run: ${RUN_URL}
          Commit: ${RELEASE_SHA}

          Closing this stale blocker because the scheduled production path pushed a release tag and the downstream Release workflow completed successfully."

          if ! gh issue close "${existing_issue}" --comment "${body}" --reason completed; then
            echo "Could not close blocked auto-release issue #${existing_issue} after successful publish; leaving release status successful."
            exit 0
          fi

      - name: Record resolved-issue auto-release retry success
        if: "${{ success() && github.event_name == 'issues' && steps.auto_release.outputs.published_tag }}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ steps.auto_release.outputs.published_sha }}
          RELEASE_TAG: ${{ steps.auto_release.outputs.published_tag }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body="Auto Release retry after blocker resolution succeeded and published \`${RELEASE_TAG}\`.

          Run: ${RUN_URL}
          Commit: ${RELEASE_SHA}

          The blocker remains closed because the retry pushed a release tag and the downstream Release workflow completed successfully."
          if ! gh issue comment "${ISSUE_NUMBER}" --body "${body}"; then
            echo "Could not comment on resolved Auto Release blocker issue #${ISSUE_NUMBER}; leaving retry status successful."
            exit 0
          fi

      - name: Record resolved-issue auto-release retry skip
        if: "${{ success() && github.event_name == 'issues' && !steps.auto_release.outputs.published_tag }}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          RETRY_SKIP_REASON: ${{ steps.auto_release.outputs.retry_skip_reason || 'no_new_pushed_release_tag' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          case "${RETRY_SKIP_REASON}" in
            same_day_window_expired)
              detail="The retry was skipped because the blocker issue was not created on the current UTC day."
              ;;
            retry_issue_number_unavailable)
              detail="The retry was skipped because the blocker issue number was unavailable in the issue event payload."
              ;;
            retry_state_unavailable)
              detail="The retry was skipped because existing blocker comments could not be inspected safely."
              ;;
            retry_already_attempted)
              detail="The retry was skipped because this blocker issue already recorded a current-day retry attempt."
              ;;
            *)
              detail="The retry completed but found no new pushed release tag, usually because no publish-eligible changes remained after the latest release tag."
              ;;
          esac
          body="Auto Release retry after blocker resolution completed without publishing a new tag.

          Run: ${RUN_URL}
          Commit: ${RELEASE_SHA}
          Retry skip reason: \`${RETRY_SKIP_REASON}\`

          ${detail}

          The blocker remains closed because the retry path did not fail."
          if ! gh issue comment "${ISSUE_NUMBER}" --body "${body}"; then
            echo "Could not comment on resolved Auto Release blocker issue #${ISSUE_NUMBER}; leaving retry status successful."
            exit 0
          fi

      - name: Alert on blocked scheduled auto-release
        if: "${{ failure() && (github.event_name == 'schedule' || github.event_name == 'issues') }}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLOSED_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          INPUT_PUSH: ${{ github.event_name == 'workflow_dispatch' && (inputs.push && 'true' || 'false') || 'true' }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'false' }}
          RELEASE_PAT_CONFIGURED: ${{ secrets.RELEASE_PAT != '' }}
          SENTRY_PERSONAL_ADMIN_TOKEN_CONFIGURED: ${{ secrets.SENTRY_PERSONAL_ADMIN_TOKEN != '' }}
          RECORDED_FAILURE_STAGE: ${{ steps.auto_release.outputs.failure_stage }}
          RECORDED_FAILURE_CAUSE: ${{ steps.auto_release.outputs.failure_cause }}
        run: |
          set -euo pipefail
          title="Auto Release blocked: scheduled run failed"
          existing_issue="${CLOSED_ISSUE_NUMBER:-}"
          if [[ -z "${existing_issue}" ]]; then
            existing_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          fi
          if [[ -n "${existing_issue}" && "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            existing_created_at="$(gh issue view "${existing_issue}" --json createdAt --jq '.createdAt // ""' 2>/dev/null || true)"
            existing_created_day="${existing_created_at%%T*}"
            current_day="$(date -u +%F)"
            if [[ -n "${existing_created_day}" && "${existing_created_day}" != "${current_day}" ]]; then
              printf -v superseded_body '%s\n\nRun: %s\nCommit: %s\n\n%s' \
                "Superseded by a new Auto Release blocker for the current UTC day." \
                "${RUN_URL}" \
                "${RELEASE_SHA}" \
                "Closing this stale blocker so same-day retry detection uses the most recent scheduled failure date."
              gh issue close "${existing_issue}" --comment "${superseded_body}" || true
              existing_issue=""
            fi
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
            failure_intro="The Auto Release retry after blocker resolution did not complete. A tag or npm package may already exist if the downstream Release workflow failed after publication; inspect the live tag, npm, and GitHub Release states before retrying."
            release_path_description="the blocker-resolution retry"
          else
            failure_intro="The scheduled daily Auto Release run did not complete. A tag or npm package may already exist if the downstream Release workflow failed after publication; inspect the live tag, npm, and GitHub Release states before retrying."
            release_path_description="the scheduled production release"
          fi
          # Prefer the verdict the failing gate recorded. The preflight booleans
          # below can only ever name a missing secret, so they stay as the
          # fallback for failures that produced no structured record (pm-x63izf).
          failing_stage="${RECORDED_FAILURE_STAGE:-unrecorded}"
          if [[ -n "${RECORDED_FAILURE_CAUSE:-}" ]]; then
            detected_cause="${RECORDED_FAILURE_CAUSE}"
          elif [[ "${INPUT_PUSH}" == "true" && "${INPUT_DRY_RUN}" != "true" && "${RELEASE_PAT_CONFIGURED}" != "true" ]]; then
            detected_cause="RELEASE_PAT is missing from the release environment; ${release_path_description} cannot push the checked version commit/tag to protected main."
          elif [[ "${INPUT_PUSH}" == "true" && "${INPUT_DRY_RUN}" != "true" && "${SENTRY_PERSONAL_ADMIN_TOKEN_CONFIGURED}" != "true" ]]; then
            detected_cause="SENTRY_PERSONAL_ADMIN_TOKEN is missing from the release environment; ${release_path_description} cannot run the mandatory reliability gate."
          else
            detected_cause="No gate recorded a verdict and the release environment is fully configured; inspect the failed workflow logs for the exact failing command."
          fi
          body="${failure_intro}

          Run: ${RUN_URL}
          Commit: ${RELEASE_SHA}
          Trigger: \`${GITHUB_EVENT_NAME}\`

          Detected preflight state:
          - push: \`${INPUT_PUSH}\`
          - dry_run: \`${INPUT_DRY_RUN}\`
          - release_pat_configured: \`${RELEASE_PAT_CONFIGURED}\`
          - sentry_personal_admin_token_configured: \`${SENTRY_PERSONAL_ADMIN_TOKEN_CONFIGURED}\`
          - failing_stage: \`${failing_stage}\`
          - detected_cause: ${detected_cause}

          Common causes:
          - \`RELEASE_PAT\` is missing from the release environment, so Auto Release cannot push its checked version commit/tag to protected \`main\`.
          - The Sentry/telemetry reliability gate blocked on an unresolved fatal/error issue inside its recent-activity window (\`--sentry-window-days\`).
          - Post-publish package execution or GitHub Release verification failed after npm accepted the package.

          Inspect the live release state and failed logs first; then configure the release token, resolve the gate's \`blocking_short_ids\`, or fix post-publish verification as indicated. This issue is auto-updated so blocked daily releases are never silently skipped."

          if [[ -n "${existing_issue}" ]]; then
            if ! gh issue comment "${existing_issue}" --body "${body}"; then
              echo "Could not comment on blocked Auto Release issue #${existing_issue}; continuing blocker state update."
            fi
            if [[ "${GITHUB_EVENT_NAME}" == "issues" ]]; then
              if ! gh issue reopen "${existing_issue}"; then
                echo "Could not reopen blocked Auto Release issue #${existing_issue} after retry failure."
              fi
            fi
          else
            gh issue create --title "${title}" --body "${body}"
          fi

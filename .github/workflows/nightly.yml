name: Nightly Validation

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: ${{ matrix.label }}
    permissions:
      contents: read
      issues: write # Scheduled failure alert
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22, shard: 1, shards: 2, label: "Nightly (ubuntu-latest, Node 22, shard 1/2)" }
          - { os: ubuntu-latest, node: 22, shard: 2, shards: 2, label: "Nightly (ubuntu-latest, Node 22, shard 2/2)" }
          - { os: ubuntu-latest, node: 24, shard: 1, shards: 4, coverage: true, label: "Nightly (ubuntu-latest, Node 24, shard 1/4)" }
          - { os: ubuntu-latest, node: 24, shard: 2, shards: 4, coverage: true, label: "Nightly (ubuntu-latest, Node 24, shard 2/4)" }
          - { os: ubuntu-latest, node: 24, shard: 3, shards: 4, coverage: true, label: "Nightly (ubuntu-latest, Node 24, shard 3/4)" }
          - { os: ubuntu-latest, node: 24, shard: 4, shards: 4, coverage: true, label: "Nightly (ubuntu-latest, Node 24, shard 4/4)" }
          - { os: ubuntu-latest, node: 25, shard: 1, shards: 2, label: "Nightly (ubuntu-latest, Node 25, shard 1/2)" }
          - { os: ubuntu-latest, node: 25, shard: 2, shards: 2, label: "Nightly (ubuntu-latest, Node 25, shard 2/2)" }
          - { os: macos-latest, node: 24, shard: 1, shards: 2, label: "Nightly (macos-latest, Node 24, shard 1/2)" }
          - { os: macos-latest, node: 24, shard: 2, shards: 2, label: "Nightly (macos-latest, Node 24, shard 2/2)" }
          - { os: windows-latest, node: 24, shard: 1, shards: 4, label: "Nightly (windows-latest, Node 24, shard 1/4)" }
          - { os: windows-latest, node: 24, shard: 2, shards: 4, label: "Nightly (windows-latest, Node 24, shard 2/4)" }
          - { os: windows-latest, node: 24, shard: 3, shards: 4, label: "Nightly (windows-latest, Node 24, shard 3/4)" }
          - { os: windows-latest, node: 24, shard: 4, shards: 4, label: "Nightly (windows-latest, Node 24, shard 4/4)" }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # pm-gh1414: full matrix tests execute the packed SDK on Node and Bun.
      - name: Setup Bun for packed SDK consumers
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Restore exact TypeScript and Vitest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts', 'scripts/*.mjs', 'scripts/**/*.mjs', 'scripts/*.mts', 'scripts/**/*.mts') }}

      - name: Restore LanceDB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .agents/pm/search/lancedb
          key: pm-cli-observability-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml', '.agents/pm/settings.json', '.agents/pm/**/*.toon', '.agents/pm/**/*.md', 'src/**/*.ts', 'scripts/**/*.mjs', 'tests/**/*.ts') }}
          restore-keys: |
            pm-cli-observability-cache-${{ runner.os }}-node${{ matrix.node }}-
            pm-cli-observability-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage gate
        if: matrix.coverage
        env:
          PM_RUN_TESTS_SKIP_BUILD: "1"
          PM_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: >-
          node scripts/run-tests.mjs coverage-shard --
          --shard=${{ matrix.shard }}/${{ matrix.shards }}
          --reporter=default
          --reporter=github-actions
          --reporter=./scripts/test-reliability-reporter.mts
          --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
          --coverage.thresholds.lines=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0

      - name: Upload coverage shard report
        if: always() && matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-coverage-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Upload test reliability report
        if: always() && matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-test-reliability-${{ matrix.shard }}
          path: .vitest-reports/reliability-${{ matrix.shard }}-4.json
          if-no-files-found: error

      - name: Test
        if: ${{ !matrix.coverage }}
        env:
          PM_RUN_TESTS_SKIP_BUILD: "1"
        run: pnpm test -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Alert on scheduled nightly failure
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_OS: ${{ matrix.os }}
          NIGHTLY_NODE: ${{ format('{0} shard {1}/{2}', matrix.node, matrix.shard, matrix.shards) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Nightly Validation failed: ${NIGHTLY_OS} / Node ${NIGHTLY_NODE}"
          existing_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          body="Scheduled Nightly Validation failed for ${NIGHTLY_OS} / Node ${NIGHTLY_NODE}.

          Run: ${RUN_URL}
          Commit: ${NIGHTLY_SHA}

          Recurrence owner: [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon).
          Family: nightly:${NIGHTLY_OS}:node:${NIGHTLY_NODE}

          Investigate before trusting the next daily release."

          if [[ -n "${existing_issue}" ]]; then
            gh issue comment "${existing_issue}" --body "${body}"
          else
            created_issue="$(gh issue create --title "${title}" --body "${body}")"
            gh issue comment "${created_issue}" --body "Recurrence tracked by [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon)."
          fi

  # pm-gxq0dt: only complete successful partitions may satisfy global exact coverage.
  coverage:
    name: Nightly (ubuntu-latest, Node 24)
    needs: nightly
    if: always()
    permissions:
      contents: read
      issues: write # Scheduled failure alert
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every native partition
        id: shard_admission
        env:
          SHARD_RESULT: ${{ needs.nightly.result }}
        run: test "$SHARD_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Download coverage shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-coverage-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge coverage and enforce global thresholds
        run: |
          pnpm exec vitest --merge-reports=.vitest-reports --coverage
          node scripts/release/coverage-threshold-gate.mjs

      - name: Alert on scheduled nightly failure
        if: failure() && github.event_name == 'schedule' && steps.shard_admission.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_OS: ubuntu-latest
          NIGHTLY_NODE: "24"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Nightly Validation failed: ${NIGHTLY_OS} / Node ${NIGHTLY_NODE}"
          existing_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          body="Scheduled Nightly Validation failed for ${NIGHTLY_OS} / Node ${NIGHTLY_NODE}.

          Run: ${RUN_URL}
          Commit: ${NIGHTLY_SHA}

          Recurrence owner: [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon).
          Family: nightly:${NIGHTLY_OS}:node:${NIGHTLY_NODE}

          Investigate before trusting the next daily release."

          if [[ -n "${existing_issue}" ]]; then
            gh issue comment "${existing_issue}" --body "${body}"
          else
            created_issue="$(gh issue create --title "${title}" --body "${body}")"
            gh issue comment "${created_issue}" --body "Recurrence tracked by [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon)."
          fi

  quality:
    name: Nightly quality (ubuntu-latest, Node 24)
    permissions:
      contents: read
      issues: write # Scheduled failure alert
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore exact TypeScript and Vitest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts', 'scripts/*.mjs', 'scripts/**/*.mjs', 'scripts/*.mts', 'scripts/**/*.mts') }}

      - name: Restore LanceDB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agents/pm/search/lancedb
          key: pm-cli-observability-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', '.agents/pm/settings.json', '.agents/pm/**/*.toon', '.agents/pm/**/*.md', 'src/**/*.ts', 'scripts/**/*.mjs', 'tests/**/*.ts') }}
          restore-keys: |
            pm-cli-observability-cache-${{ runner.os }}-node24-
            pm-cli-observability-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version policy check
        run: pnpm version:check

      - name: Secret leak scan
        run: pnpm security:scan

      - name: Build
        run: pnpm build

      - name: Prepare tracker clone invariants
        run: |
          node dist/cli.js merge install --no-extensions
          git diff --exit-code -- .gitattributes

      - name: Static quality gate
        run: pnpm quality:static

      - name: Compatibility migration gate
        timeout-minutes: 6
        run: node scripts/release/compatibility-check.mjs --json

      - name: Published workspace compatibility matrix
        timeout-minutes: 6
        run: node scripts/release/workspace-compatibility.mjs --json

      - name: Alert on scheduled nightly failure
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_OS: ubuntu-latest
          NIGHTLY_NODE: "24 quality"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Nightly Validation failed: ${NIGHTLY_OS} / Node ${NIGHTLY_NODE}"
          existing_issue="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          body="Scheduled Nightly Validation failed for ${NIGHTLY_OS} / Node ${NIGHTLY_NODE}.

          Run: ${RUN_URL}
          Commit: ${NIGHTLY_SHA}

          Recurrence owner: [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon).
          Family: nightly:${NIGHTLY_OS}:node:${NIGHTLY_NODE}

          Investigate before trusting the next daily release."

          if [[ -n "${existing_issue}" ]]; then
            gh issue comment "${existing_issue}" --body "${body}"
          else
            created_issue="$(gh issue create --title "${title}" --body "${body}")"
            gh issue comment "${created_issue}" --body "Recurrence tracked by [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon)."
          fi

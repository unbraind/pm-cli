name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # Allow CodSpeed to trigger backtest performance analysis to seed initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks (Ubuntu 22.04, Node 24)
    # CodSpeed supports Ubuntu 22.04 and 24.04, but GitHub's rolling
    # ubuntu-latest pool can mix image revisions during a rollout. Pinning the
    # OS family keeps Valgrind/libc6-dbg installation on one stable baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          # Install instruments against this runner instead of restoring
          # packages built for a different hosted-image revision.
          cache-instruments: "false"
          run: pnpm vitest bench --run --config vitest.bench.config.ts

name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v2026.5.5"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Test, Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RECOVERY_SOURCE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'main' || 'tag' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Validate exact-tag recovery source
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Exact-tag recovery must be dispatched from ${DEFAULT_BRANCH}; received ${GITHUB_REF_NAME}." >&2
            exit 2
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Select exact-tag recovery source
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NPM_PACKAGE="$(node -p 'require("./package.json").name')"
          probe_output="$(mktemp)"
          probe_npmrc="$(mktemp)"
          probe_cache="${RUNNER_TEMP}/npm-cache-recovery-probe"
          trap 'rm -f "${probe_output}" "${probe_npmrc}"' EXIT

          case "${RELEASE_TAG}" in
            v*.*.*) ;;
            *)
              echo "Release tag must have v<major>.<minor>.<patch> shape" >&2
              exit 1
              ;;
          esac

          if env -u NODE_AUTH_TOKEN -u NPM_TOKEN \
            npm_config_userconfig="${probe_npmrc}" \
            npm_config_cache="${probe_cache}" \
            npm view "${NPM_PACKAGE}@${VERSION}" version --json >"${probe_output}" 2>&1; then
            echo "Exact ${NPM_PACKAGE}@${VERSION} exists; recovery will use reviewed ${DEFAULT_BRANCH} source and cannot republish it."
            echo "RECOVERY_SOURCE_MODE=main" >> "${GITHUB_ENV}"
            exit 0
          else
            probe_status=$?
          fi
          if ! grep -Eq 'E404|ETARGET|404 Not Found|No match found for version' "${probe_output}"; then
            echo "Authenticated exact-version probe failed without a definitive missing-version response (status ${probe_status})." >&2
            exit "${probe_status}"
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git checkout --detach "${tag_commit}"
          echo "Exact ${NPM_PACKAGE}@${VERSION} is unpublished; recovery pinned source to ${RELEASE_TAG} (${tag_commit})."
          echo "RECOVERY_SOURCE_MODE=tag" >> "${GITHUB_ENV}"

      - name: Restore TypeScript and Vitest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tsbuildinfo
            .cache/vitest
          key: pm-cli-validation-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'vitest.config.ts', 'src/**/*.ts', 'tests/**/*.ts', 'packages/**/*.ts') }}
          restore-keys: |
            pm-cli-validation-cache-${{ runner.os }}-node24-
            pm-cli-validation-cache-${{ runner.os }}-

      - name: Restore LanceDB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .agents/pm/search/lancedb
          key: pm-cli-observability-cache-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', '.agents/pm/settings.json', '.agents/pm/**/*.toon', '.agents/pm/**/*.md', 'src/**/*.ts', 'scripts/**/*.mjs', 'tests/**/*.ts') }}
          restore-keys: |
            pm-cli-observability-cache-${{ runner.os }}-node24-
            pm-cli-observability-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version policy + tag guard
        run: |
          case "${RELEASE_TAG}" in
            v*.*.*) ;;
            *)
              echo "Release tag must match v*.*.*; received ${RELEASE_TAG}"
              exit 2
              ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${RECOVERY_SOURCE_MODE}" = "main" ]; then
            echo "Exact-tag recovery uses reviewed repository default-branch source and verifies ${RELEASE_TAG} without requiring historical source-version equality."
          else
            node scripts/release-version.mjs check --tag "${RELEASE_TAG}"
          fi

      - name: Secret leak scan
        run: pnpm security:scan

      - name: Build
        run: pnpm build

      - name: Prepare tracker clone invariants
        run: node dist/cli.js merge install --no-extensions

      - name: Typecheck
        run: pnpm typecheck

      - name: Docs and skills gate
        run: pnpm quality:docs-skills

      - name: Test with coverage gate
        env:
          PM_RUN_TESTS_SKIP_BUILD: "1"
        run: pnpm test:coverage

      - name: Verify generated pm changelog
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${RECOVERY_SOURCE_MODE}" = "tag" ]; then
            pnpm changelog:pm
            unexpected_paths="$(git diff --name-only -- . \
              ':(exclude)CHANGELOG.md' \
              ':(exclude).agents/pm/extensions/.managed-extensions.json')"
            if [ -n "${unexpected_paths}" ]; then
              echo "Exact-tag changelog recovery changed unexpected tracked paths:" >&2
              printf '%s\n' "${unexpected_paths}" >&2
              exit 1
            fi
            echo "Exact-tag recovery regenerated the package changelog with the tagged checkout's canonical policy."
          else
            pnpm changelog:pm:check
          fi

      - name: Static quality gate
        run: pnpm quality:static

      - name: Pre-release assurance trigger
        run: node scripts/release/repository-assurance.mjs repository-static-quality --trigger pre-release --json

      - name: Context quality and token-entitlement gate
        run: pnpm quality:context-eval

      - name: Compatibility migration gate
        timeout-minutes: 6
        run: node scripts/release/compatibility-check.mjs --json

      - name: Reliability threshold gate
        env:
          SENTRY_PERSONAL_ADMIN_TOKEN: ${{ secrets.SENTRY_PERSONAL_ADMIN_TOKEN }}
        run: |
          if [ -z "${SENTRY_PERSONAL_ADMIN_TOKEN:-}" ]; then
            echo "SENTRY_PERSONAL_ADMIN_TOKEN is required for the Sentry issue threshold gate."
            exit 1
          fi
          node scripts/release/sentry-telemetry-gate.mjs --json --telemetry-mode off --sentry-window-days 14 --max-critical 0 --max-high 0

      - name: Upload Sentry sourcemaps
        timeout-minutes: 5
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: unbrained
          SENTRY_PROJECT: pm-cli
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN is not configured; skipping Sentry sourcemap upload."
            exit 0
          fi
          RELEASE="pm-cli@${RELEASE_TAG#v}"
          pnpm exec sentry-cli releases new "$RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            || pnpm exec sentry-cli releases info "$RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          pnpm exec sentry-cli releases set-commits "$RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --auto \
            || pnpm exec sentry-cli releases set-commits "$RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --local --ignore-missing
          pnpm sentry:inject
          pnpm sentry:upload
          pnpm exec sentry-cli releases finalize "$RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"

      - name: Packaging smoke check
        run: node scripts/release/package-artifact-gate.mjs

      - name: npx tarball smoke check
        run: pnpm smoke:npx

      - name: Package-first dogfood
        run: pnpm dogfood:package-first

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs --version "${RELEASE_TAG#v}" --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: coverage
          if-no-files-found: ignore

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Publish to npm
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NPM_PACKAGE="$(node -p 'require("./package.json").name')"
          export NPM_PACKAGE
          PUBLIC_NPMRC="${RUNNER_TEMP}/npmrc-public"
          PUBLIC_NPM_CACHE="${RUNNER_TEMP}/npm-cache-public"
          : > "${PUBLIC_NPMRC}"

          anonymous_npm_view() {
            env -u NODE_AUTH_TOKEN -u NPM_TOKEN \
              npm_config_userconfig="${PUBLIC_NPMRC}" \
              npm_config_cache="${PUBLIC_NPM_CACHE}" \
              npm view "$1" "$2" --json >/dev/null 2>&1
          }

          publish_release() {
            env -u NODE_AUTH_TOKEN -u NPM_TOKEN \
              npm_config_userconfig="${PUBLIC_NPMRC}" \
              npm_config_cache="${PUBLIC_NPM_CACHE}" \
              npm publish --access public --provenance --tag latest
          }

          if anonymous_npm_view "${NPM_PACKAGE}@${VERSION}" version; then
            echo "${NPM_PACKAGE}@${VERSION} is publicly available; skipping npm publish."
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${RECOVERY_SOURCE_MODE}" != "tag" ]; then
            echo "Main-source exact-tag recovery requires an existing public ${NPM_PACKAGE}@${VERSION}; refusing to publish different source under an immutable tag." >&2
            exit 1
          elif anonymous_npm_view "${NPM_PACKAGE}" name; then
            echo "${NPM_PACKAGE} is publicly available but ${VERSION} is not; publishing."
            publish_release
          else
            echo "${NPM_PACKAGE} is not publicly discoverable. Trusted publishing authorizes npm publish only; restore public package access outside this workflow before retrying immutable publication." >&2
            exit 1
          fi

      - name: Verify published package on npm, npx, and bunx
        timeout-minutes: 8
        run: node scripts/release/verify-published-release.mjs --tag "${RELEASE_TAG}" --skip-github-release --json

      - name: Accept exact installed package through npm and Bun agent sessions
        timeout-minutes: 12
        run: node scripts/release/verify-installed-agent-session.mjs --version "${RELEASE_TAG#v}" --manager both --json

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Verify GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-published-release.mjs --tag "${RELEASE_TAG}" --skip-package --json

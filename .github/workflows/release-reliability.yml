name: Release Reliability

on:
  workflow_run:
    workflows: [Auto Release, Nightly Validation]
    types: [completed]
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-reliability
  cancel-in-progress: false

jobs:
  report:
    name: Release origins and nightly recurrence reliability
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Evaluate rolling scheduled reliability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RELIABILITY_OUTPUT: ${{ runner.temp }}/release-reliability.json
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { main } from "./scripts/release/collect-release-reliability.mjs";
          const report = main();
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Scheduled release reliability\n\nWindow: ${report.window_start} to ${report.window_end}\n\n` +
            `Original scheduled attempts: ${report.completed}; failed: ${report.failed}; pending: ${report.pending}\n\n` +
            `Morning dispatcher attempts: ${report.dispatcher.completed}; failed: ${report.dispatcher.failed}; pending: ${report.dispatcher.pending}\n\n` +
            `Morning dispatcher failing stages: ${JSON.stringify(report.dispatcher.failure_stages)}\n\n` +
            `Declared origin series: ${JSON.stringify(Object.fromEntries(Object.entries(report.origins).map(([origin, series]) => [origin, { completed: series.completed, failed: series.failed, failure_rate: series.failure_rate, failure_stages: series.failure_stages }])))}\n\n` +
            `Pre-attribution dispatch gaps: ${report.pre_attribution_gap.join(", ") || "none"}\n\n` +
            `Policy findings: ${report.violations.join(", ") || "none"}\n\n` +
            `Outcome evidence complete: ${report.outcome_evidence_complete}\n\n` +
            "PM owners: [pm-e70zh5](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-e70zh5.toon), " +
            "[pm-44u3wt](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-44u3wt.toon)\n");
          process.exitCode = report.ok ? 0 : 1;
          JS
      - name: Preserve reliability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-reliability.json
          if-no-files-found: error
          retention-days: 90
      - name: Setup pnpm for the public reliability SDK
        if: always()
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0
      - name: Build trusted reliability SDK
        id: sdk
        if: always()
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Evaluate rolling nightly recurrence reliability
        if: always() && steps.sdk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RELIABILITY_OUTPUT: ${{ runner.temp }}/nightly-reliability.json
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { main } from "./scripts/release/collect-nightly-reliability.mjs";
          const report = main();
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Nightly recurrence reliability\n\nWindow: ${report.window_start} to ${report.window_end}\n\n` +
            report.families.map((family) => `${family.family}: ${family.failed}/${family.completed} original failures; ${family.affected_days.length} affected UTC days; findings: ${family.violations.join(", ") || "none"}`).join("\n\n") +
            "\n\nRepair durations use alert closure only; product/infrastructure causes remain unknown without evidence.\n\n" +
            "PM owner: [pm-2zjs0g](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-2zjs0g.toon)\n");
          process.exitCode = report.ok ? 0 : 1;
          JS
      - name: Preserve nightly reliability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-reliability.json
          if-no-files-found: error
          retention-days: 90
      - name: Reconcile full release ledgers
        if: always() && steps.sdk.outcome == 'success'
        env:
          RELEASE_LEDGERS_OUTPUT: ${{ runner.temp }}/release-ledgers.json
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { main } from "./scripts/release/collect-release-ledgers.mjs";
          const report = main();
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Full release ledgers\n\nComplete population: ${JSON.stringify(report.counts)}\n\n` +
            `Divergence classes: ${JSON.stringify(report.classes)}\n\n` +
            report.findings.map((finding) => `${finding.identity}: missing from ${finding.missing_from.join(", ")}; ${finding.disposition?.reason ?? "UNSETTLED"}`).join("\n\n") +
            `\n\nStale exceptions: ${report.stale_exceptions.join(", ") || "none"}\n\n` +
            "PM owner: [pm-q91qyd](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-q91qyd.toon)\n");
          process.exitCode = report.ok ? 0 : 1;
          JS
      - name: Preserve full release-ledger report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-ledgers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-ledgers.json
          if-no-files-found: error
          retention-days: 90

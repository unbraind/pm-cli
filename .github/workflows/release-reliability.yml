name: Release Reliability

on:
  workflow_run:
    workflows: [Auto Release]
    types: [completed]
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-reliability
  cancel-in-progress: false

jobs:
  report:
    name: Scheduled release reliability
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Evaluate rolling scheduled reliability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RELIABILITY_OUTPUT: ${{ runner.temp }}/release-reliability.json
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          import { main } from "./scripts/release/collect-release-reliability.mjs";
          const report = main();
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Scheduled release reliability\n\nWindow: ${report.window_start} to ${report.window_end}\n\n` +
            `Original scheduled attempts: ${report.completed}; failed: ${report.failed}; pending: ${report.pending}\n\n` +
            `Policy findings: ${report.violations.join(", ") || "none"}\n\n` +
            `Outcome evidence complete: ${report.outcome_evidence_complete}\n\n` +
            "PM owners: [pm-e70zh5](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-e70zh5.toon), " +
            "[pm-44u3wt](https://github.com/unbraind/pm-cli/blob/main/.agents/pm/issues/pm-44u3wt.toon)\n");
          process.exitCode = report.ok ? 0 : 1;
          JS
      - name: Preserve reliability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-reliability.json
          if-no-files-found: error
          retention-days: 90
